services:
  - type: web
    name: aurora-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: ""
    startCommand: "node -e \"require('http').createServer((_,r)=>{r.writeHead(200);r.end('stopped')}).listen(process.env.PORT||3000)\""
    healthCheckPath: /
    envVars:
      - key: WEBAPP_URL
        value: https://afiomacomplate.github.io/ggsell/
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
